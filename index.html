<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VANTA Exchange</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  min-height:100%;
}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 85% 0%,rgba(119,65,210,.30),transparent 34%),
    radial-gradient(circle at 0% 55%,rgba(70,35,130,.18),transparent 35%),
    #070709;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input,select{
  font:inherit;
}
button{
  border:0;
  cursor:pointer;
}
.app{
  width:100%;
  max-width:620px;
  margin:auto;
  padding:22px 16px 50px;
}
/* HEADER */
.header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
}
.logo{
  font-size:31px;
  line-height:1;
  font-weight:900;
  letter-spacing:4px;
}
.sub{
  margin-top:5px;
  color:#68636f;
  font-size:8px;
  font-weight:700;
  letter-spacing:4px;
}
.online{
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px 11px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:50px;
  background:rgba(255,255,255,.025);
  color:#77727e;
  font-size:9px;
  font-weight:800;
}
.online-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#9b6cff;
  box-shadow:0 0 12px #8b5cf6;
}
/* USER */
.user-id{
  margin-top:25px;
  color:#65606c;
  font-size:11px;
}
.user-id span{
  color:#e5e2eb;
  font-weight:800;
}
/* BALANCE */
.balance{
  position:relative;
  overflow:hidden;
  min-height:150px;
  margin-top:12px;
  padding:24px;
  border:1px solid rgba(255,255,255,.09);
  border-radius:26px;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.065),
      rgba(255,255,255,.025)
    );
  box-shadow:
    0 25px 70px rgba(0,0,0,.38);
}
.balance-glow{
  position:absolute;
  width:220px;
  height:220px;
  top:-120px;
  right:-80px;
  border-radius:50%;
  background:#7c3aed;
  opacity:.23;
  filter:blur(60px);
}
.balance-label{
  position:relative;
  color:#77727e;
  font-size:9px;
  font-weight:800;
  letter-spacing:2px;
}
.balance-value{
  position:relative;
  margin-top:9px;
  font-size:38px;
  line-height:1.1;
  font-weight:900;
  letter-spacing:-1px;
}
.balance-currency{
  position:relative;
  margin-top:6px;
  color:#66616d;
  font-size:10px;
  font-weight:700;
}
/* STATUS */
.status{
  margin-top:12px;
  padding:12px 14px;
  border:1px solid rgba(255,255,255,.07);
  border-radius:15px;
  background:rgba(255,255,255,.025);
  color:#77727e;
  text-align:center;
  font-size:10px;
  font-weight:700;
}
/* HOME CARDS */
.home-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}
.home-card{
  min-height:145px;
  padding:17px;
  border:1px solid rgba(255,255,255,.075);
  border-radius:22px;
  background:rgba(255,255,255,.04);
  color:#fff;
  text-align:left;
  transition:.15s;
}
.home-card:active{
  transform:scale(.97);
}
.home-icon{
  width:44px;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:14px;
  background:rgba(139,92,246,.12);
  color:#c6adff;
  font-size:20px;
}
.home-title{
  margin-top:14px;
  font-size:13px;
  font-weight:900;
}
.home-description{
  margin-top:5px;
  color:#696470;
  font-size:10px;
  line-height:1.45;
}
/* SCREENS */
.screen{
  display:none;
}
/* BACK */
.back{
  padding:4px 0;
  background:none;
  color:#88838f;
  font-size:12px;
  font-weight:700;
}
/* TITLES */
.page-title{
  margin-top:20px;
  font-size:30px;
  line-height:1;
  font-weight:900;
  letter-spacing:-.7px;
}
.page-subtitle{
  margin-top:8px;
  color:#6d6875;
  font-size:11px;
}
/* TABS */
.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  margin-top:20px;
  padding:5px;
  border:1px solid rgba(255,255,255,.07);
  border-radius:17px;
  background:#101014;
}
.tabs button{
  padding:12px;
  border-radius:12px;
  background:transparent;
  color:#77727e;
  font-size:12px;
  font-weight:800;
}
.tabs button.active{
  color:#fff;
  background:linear-gradient(135deg,#9b6cff,#6724d5);
}
/* CREATE BUTTON */
.create-offer{
  width:100%;
  margin-top:10px;
  padding:15px;
  border-radius:16px;
  background:#fff;
  color:#08080a;
  font-size:12px;
  font-weight:900;
}
/* SEARCH */
.search-box{
  position:relative;
  margin-top:18px;
}
.search-icon{
  position:absolute;
  left:17px;
  top:50%;
  z-index:2;
  transform:translateY(-50%);
  color:#77727e;
  font-size:20px;
  pointer-events:none;
}
.search-input{
  width:100%;
  height:55px;
  padding:0 16px 0 47px;
  outline:none;
  border:1px solid rgba(255,255,255,.10);
  border-radius:18px;
  background:#111116;
  color:#fff;
  font-size:14px;
  transition:.2s;
}
.search-input::placeholder{
  color:#57525e;
}
.search-input:focus{
  border-color:rgba(139,92,246,.55);
  box-shadow:0 0 0 3px rgba(139,92,246,.08);
}
/* FILTERS */
.filters{
  display:flex;
  gap:7px;
  margin-top:10px;
  overflow-x:auto;
  scrollbar-width:none;
}
.filters::-webkit-scrollbar{
  display:none;
}
.filter{
  flex:none;
  padding:9px 14px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:50px;
  background:#101014;
  color:#77727e;
  font-size:10px;
  font-weight:800;
}
.filter.active{
  border-color:rgba(139,92,246,.35);
  background:rgba(139,92,246,.14);
  color:#fff;
}
/* ASSET LIST */
.asset-list{
  margin-top:12px;
}
.asset{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
  padding:14px;
  border:1px solid rgba(255,255,255,.075);
  border-radius:19px;
  background:rgba(255,255,255,.035);
  transition:.15s;
}
.asset:active{
  transform:scale(.98);
}
.asset-left{
  display:flex;
  align-items:center;
  gap:12px;
}
.asset-icon{
  width:44px;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:14px;
  background:linear-gradient(145deg,#292633,#111116);
  color:#c5aaff;
  font-size:16px;
  font-weight:900;
}
.asset-symbol{
  font-size:13px;
  font-weight:900;
}
.asset-name{
  margin-top:3px;
  color:#696470;
  font-size:10px;
}
.asset-type{
  color:#5d5864;
  font-size:8px;
  font-weight:800;
  letter-spacing:1px;
}
.empty{
  padding:30px 10px;
  color:#625d68;
  text-align:center;
  font-size:11px;
}
/* FORM */
.info{
  margin-top:18px;
  padding:13px;
  border:1px solid rgba(139,92,246,.18);
  border-radius:16px;
  background:rgba(139,92,246,.08);
  color:#b99cff;
  text-align:center;
  font-size:10px;
  font-weight:800;
}
.form{
  margin-top:18px;
}
.field{
  margin-top:15px;
}
.field:first-child{
  margin-top:0;
}
.field-label{
  margin-bottom:7px;
  color:#77727e;
  font-size:9px;
  font-weight:800;
  letter-spacing:1.4px;
}
.input,
.select{
  width:100%;
  padding:15px;
  outline:none;
  border:1px solid rgba(255,255,255,.08);
  border-radius:15px;
  background:#111116;
  color:#fff;
}
.input:focus,
.select:focus{
  border-color:rgba(139,92,246,.5);
}
.publish{
  width:100%;
  margin-top:18px;
  padding:16px;
  border-radius:17px;
  background:linear-gradient(135deg,#9b6cff,#6724d5);
  color:#fff;
  font-size:12px;
  font-weight:900;
}
.cancel{
  width:100%;
  margin-top:8px;
  padding:15px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:17px;
  background:#111116;
  color:#77727e;
  font-size:12px;
  font-weight:800;
}
/* MOBILE */
@media(max-width:380px){
  .app{
    padding-left:13px;
    padding-right:13px;
  }
  .logo{
    font-size:28px;
  }
  .balance-value{
    font-size:34px;
  }
}
</style>
</head>

<script>
/* ==================================================
   VANTA API
   Твоя Supabase Edge Function называется:
   dynamic-action
================================================== */
const VANTA_API =
"https://nwbzyziszijhqtkdhhog.supabase.co/functions/v1/dynamic-action";
/* ==================================================
   TELEGRAM
================================================== */
const tg =
  window.Telegram &&
  window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;
if(tg){
  tg.ready();
  tg.expand();
}
/* ==================================================
   STATE
================================================== */
let currentMode = "buy";
let currentFilter = "all";
const assets = [
  {
    symbol:"BTC",
    name:"Bitcoin",
    type:"crypto"
  },
  {
    symbol:"ETH",
    name:"Ethereum",
    type:"crypto"
  },
  {
    symbol:"USDT",
    name:"Tether",
    type:"stablecoin"
  },
  {
    symbol:"USDC",
    name:"USD Coin",
    type:"stablecoin"
  },
  {
    symbol:"USD",
    name:"US Dollar",
    type:"fiat"
  },
  {
    symbol:"EUR",
    name:"Euro",
    type:"fiat"
  },
  {
    symbol:"KZT",
    name:"Kazakhstani Tenge",
    type:"fiat"
  },
  {
    symbol:"GBP",
    name:"British Pound",
    type:"fiat"
  },
  {
    symbol:"CNY",
    name:"Chinese Yuan",
    type:"fiat"
  },
  {
    symbol:"AED",
    name:"UAE Dirham",
    type:"fiat"
  }
];
/* ==================================================
   HELPER
================================================== */
function $(elementId){
  return document.getElementById(
    elementId
  );
}
/* ==================================================
   SCREEN NAVIGATION
================================================== */
function showScreen(name){
  $("home").style.display = "none";
  $("p2p").style.display = "none";
  $("create").style.display = "none";
  $(name).style.display = "block";
  window.scrollTo(
    {
      top:0,
      behavior:"instant"
    }
  );
}
/* ==================================================
   CONNECT TO VANTA
================================================== */
async function connectVanta(){
  /*
    Telegram должен передать пользователя.
  */
  if(!tg){
    $("userId").textContent =
      "Telegram";
    $("status").textContent =
      "Открой приложение через Telegram";
    return;
  }
  const user =
    tg.initDataUnsafe &&
    tg.initDataUnsafe.user;
  if(!user){
    $("userId").textContent =
      "не найден";
    $("status").textContent =
      "Telegram ID не получен";
    return;
  }
  /*
    Показываем ID сразу,
    не ждём ответа API.
  */
  $("userId").textContent =
    user.username
      ? "@" + user.username
      : user.first_name ||
        String(user.id);
  /*
    Таймер нужен только для того,
    чтобы загрузка не могла зависнуть
    навсегда.
  */
  const controller =
    new AbortController();
  const timeout =
    setTimeout(
      () => controller.abort(),
      7000
    );
  try{
    const response =
      await fetch(
        VANTA_API,
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            telegram_id:
              user.id,
            username:
              user.username ||
              null,
            first_name:
              user.first_name ||
              null
          }),
          signal:
            controller.signal
        }
      );
    clearTimeout(timeout);
    const text =
      await response.text();
    console.log(
      "VANTA API RESPONSE:",
      response.status,
      text
    );
    /*
      Пытаемся разобрать ответ.
    */
    let data = {};
    try{
      data =
        JSON.parse(text);
    }catch(error){
      console.log(
        "API response is not JSON"
      );
    }
    /*
      API может вернуть:
      { balance: 100 }
      или
      { user: { balance: 100 } }
    */
    const userData =
      data &&
      data.user
        ? data.user
        : data;
    /*
      Если баланс реально присутствует,
      подключение считаем успешным.
    */
    if(
      userData &&
      userData.balance !== undefined &&
      userData.balance !== null
    ){
      const numericBalance =
        Number(
          userData.balance
        );
      const safeBalance =
        Number.isFinite(
          numericBalance
        )
          ? numericBalance
          : 0;
      $("balance").textContent =
        safeBalance.toLocaleString(
          "ru-RU",
          {
            minimumFractionDigits:2,
            maximumFractionDigits:8
          }
        );
      $("status").textContent =
        "● VANTA ACCOUNT подключён";
      return;
    }
    /*
      Даже если баланс не пришёл,
      HTTP 2xx означает, что функция
      доступна.
    */
    if(
      response.ok
    ){
      $("status").textContent =
        "● VANTA ACCOUNT подключён";
      return;
    }
    /*
      Если сервер действительно вернул
      ошибку.
    */
    throw new Error(
      data.error ||
      "HTTP " +
      response.status
    );
  }catch(error){
    clearTimeout(timeout);
    console.error(
      "VANTA CONNECTION ERROR:",
      error
    );
    /*
      Не показываем бесконечную загрузку.
      Уже полученный баланс не затираем.
    */
    $("status").textContent =
      "Не удалось обновить данные";
  }
}
/* ==================================================
   RENDER ASSETS
================================================== */
function renderAssets(){
  const query =
    $("searchInput")
      .value
      .trim()
      .toLowerCase();
  const filtered =
    assets.filter(
      asset => {
        const symbol =
          asset.symbol
            .toLowerCase();
        const name =
          asset.name
            .toLowerCase();
        const matchesSearch =
          !query ||
          symbol.includes(query) ||
          name.includes(query);
        const matchesFilter =
          currentFilter === "all" ||
          asset.type === currentFilter;
        return (
          matchesSearch &&
          matchesFilter
        );
      }
    );
  if(!filtered.length){
    $("assetList").innerHTML =
      `
      <div class="empty">
        Ничего не найдено
      </div>
      `;
    return;
  }
  $("assetList").innerHTML =
    filtered
      .map(
        asset => {
          let icon = "¤";
          if(
            asset.type === "crypto"
          ){
            icon =
              asset.symbol === "BTC"
                ? "₿"
                : "◆";
          }
          if(
            asset.type === "stablecoin"
          ){
            icon = "$";
          }
          return `
            <div
              class="asset"
              data-symbol="${asset.symbol}">
              <div class="asset-left">
                <div class="asset-icon">
                  ${icon}
                </div>
                <div>
                  <div class="asset-symbol">
                    ${asset.symbol}
                  </div>
                  <div class="asset-name">
                    ${asset.name}
                  </div>
                </div>
              </div>
              <div class="asset-type">
                ${asset.type.toUpperCase()}
              </div>
            </div>
          `;
        }
      )
      .join("");
  document
    .querySelectorAll(".asset")
    .forEach(
      item => {
        item.onclick =
          () => {
            $("assetSelect").value =
              item.dataset.symbol;
            showScreen(
              "create"
            );
          };
      }
    );
}
/* ==================================================
   FILL ASSET SELECT
================================================== */
function fillAssetSelect(){
  assets.forEach(
    asset => {
      const option =
        document.createElement(
          "option"
        );
      option.value =
        asset.symbol;
      option.textContent =
        asset.symbol +
        " — " +
        asset.name;
      $("assetSelect")
        .appendChild(
          option
        );
    }
  );
}
/* ==================================================
   HOME → P2P
================================================== */
$("p2pButton").onclick =
  () => {
    showScreen(
      "p2p"
    );
    renderAssets();
  };
/* ==================================================
   BACK
================================================== */
$("backP2P").onclick =
  () => {
    showScreen(
      "home"
    );
  };
$("backCreate").onclick =
  () => {
    showScreen(
      "p2p"
    );
  };
$("cancelButton").onclick =
  () => {
    showScreen(
      "p2p"
    );
  };
/* ==================================================
   CREATE OFFER
================================================== */
$("createButton").onclick =
  () => {
    showScreen(
      "create"
    );
  };
/* ==================================================
   BUY / SELL
================================================== */
$("buyTab").onclick =
  () => {
    currentMode =
      "buy";
    $("buyTab")
      .classList
      .add("active");
    $("sellTab")
      .classList
      .remove("active");
    $("modeInfo").textContent =
      "Вы создаёте объявление на покупку";
  };
$("sellTab").onclick =
  () => {
    currentMode =
      "sell";
    $("sellTab")
      .classList
      .add("active");
    $("buyTab")
      .classList
      .remove("active");
    $("modeInfo").textContent =
      "Вы создаёте объявление на продажу";
  };
/* ==================================================
   SEARCH
================================================== */
$("searchInput")
  .addEventListener(
    "input",
    renderAssets
  );
/* ==================================================
   FILTERS
================================================== */
document
  .querySelectorAll(".filter")
  .forEach(
    button => {
      button.onclick =
        () => {
          document
            .querySelectorAll(".filter")
            .forEach(
              item =>
                item.classList
                  .remove(
                    "active"
                  )
            );
          button.classList
            .add("active");
          currentFilter =
            button.dataset.type;
          renderAssets();
        };
    }
  );
/* ==================================================
   PUBLISH
================================================== */
$("publishButton").onclick =
  () => {
    const asset =
      $("assetSelect").value;
    const currency =
      $("currencySelect").value;
    const amount =
      Number(
        $("amount").value
      );
    const price =
      Number(
        $("price").value
      );
    if(!asset){
      alert(
        "Выберите актив"
      );
      return;
    }
    if(
      !Number.isFinite(amount) ||
      amount <= 0
    ){
      alert(
        "Введите количество"
      );
      return;
    }
    if(
      !Number.isFinite(price) ||
      price <= 0
    ){
      alert(
        "Введите цену"
      );
      return;
    }
    alert(
      "Объявление: " +
      currentMode.toUpperCase() +
      "\n" +
      asset +
      "\n" +
      amount +
      " × " +
      price +
      " " +
      currency
    );
  };
/* ==================================================
   START
================================================== */
fillAssetSelect();
renderAssets();
connectVanta();
</script>
</body>
</html>
