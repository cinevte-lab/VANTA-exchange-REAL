<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VANTA Exchange</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}
body{
  min-height:100vh;
  color:#fff;
  background:
    radial-gradient(circle at 80% 0%,#24134a 0,transparent 32%),
    radial-gradient(circle at 0% 40%,#171025 0,transparent 30%),
    #070709;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input,select{
  font:inherit;
}
button{
  border:0;
}
.app{
  max-width:620px;
  margin:auto;
  padding:22px 16px 45px;
}
.header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
}
.logo{
  font-size:31px;
  font-weight:900;
  letter-spacing:4px;
}
.sub{
  margin-top:3px;
  color:#66636e;
  font-size:8px;
  letter-spacing:4px;
}
.online{
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 10px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:50px;
  color:#77737f;
  font-size:9px;
  font-weight:800;
}
.online-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#9b6cff;
  box-shadow:0 0 12px #8b5cf6;
}
.id{
  margin-top:25px;
  color:#66636e;
  font-size:11px;
}
.id span{
  color:#ddd;
  font-weight:700;
}
.balance{
  position:relative;
  overflow:hidden;
  margin-top:12px;
  padding:23px;
  min-height:145px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:25px;
  background:rgba(255,255,255,.045);
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}
.balance-glow{
  position:absolute;
  width:190px;
  height:190px;
  right:-90px;
  top:-100px;
  border-radius:50%;
  background:#7c3aed;
  opacity:.22;
  filter:blur(55px);
}
.balance-label{
  position:relative;
  color:#77727e;
  font-size:9px;
  font-weight:800;
  letter-spacing:2px;
}
.balance-value{
  position:relative;
  margin-top:9px;
  font-size:38px;
  line-height:1.1;
  font-weight:900;
}
.balance-currency{
  position:relative;
  margin-top:6px;
  color:#68636f;
  font-size:10px;
}
.status{
  margin-top:12px;
  padding:12px;
  border:1px solid rgba(255,255,255,.07);
  border-radius:14px;
  background:rgba(255,255,255,.025);
  color:#77727e;
  text-align:center;
  font-size:10px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}
.card{
  min-height:140px;
  padding:17px;
  border:1px solid rgba(255,255,255,.075);
  border-radius:21px;
  background:rgba(255,255,255,.04);
}
.card:active{
  transform:scale(.97);
}
.icon{
  width:43px;
  height:43px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:14px;
  background:rgba(139,92,246,.12);
  color:#c6adff;
  font-size:20px;
}
.card-title{
  margin-top:13px;
  font-size:13px;
  font-weight:900;
}
.card-text{
  margin-top:5px;
  color:#68636f;
  font-size:10px;
  line-height:1.45;
}
.screen{
  display:none;
}
.back{
  padding:5px 0;
  background:none;
  color:#88838f;
  font-size:12px;
}
.title{
  margin-top:20px;
  font-size:30px;
  font-weight:900;
}
.subtitle{
  margin-top:5px;
  color:#6d6875;
  font-size:11px;
}
.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  margin-top:20px;
  padding:5px;
  border:1px solid rgba(255,255,255,.07);
  border-radius:16px;
  background:#101014;
}
.tabs button{
  padding:12px;
  border-radius:12px;
  background:transparent;
  color:#77727e;
  font-weight:800;
}
.tabs button.active{
  color:#fff;
  background:linear-gradient(135deg,#9b6cff,#6724d5);
}
.create-button{
  width:100%;
  margin-top:10px;
  padding:15px;
  border-radius:15px;
  background:#fff;
  color:#08080a;
  font-weight:900;
}
.search{
  position:relative;
  margin-top:18px;
}
.search input{
  width:100%;
  height:52px;
  padding:0 16px 0 45px;
  border:1px solid rgba(255,255,255,.1);
  outline:none;
  border-radius:17px;
  background:#111116;
  color:#fff;
  font-size:14px;
}
.search input::placeholder{
  color:#57535e;
}
.search input:focus{
  border-color:rgba(139,92,246,.55);
  box-shadow:0 0 0 3px rgba(139,92,246,.08);
}
.search-symbol{
  position:absolute;
  left:17px;
  top:50%;
  transform:translateY(-50%);
  color:#77727e;
  font-size:19px;
  z-index:2;
}
.filters{
  display:flex;
  gap:7px;
  margin-top:10px;
  overflow-x:auto;
  scrollbar-width:none;
}
.filters::-webkit-scrollbar{
  display:none;
}
.filter{
  flex:none;
  padding:9px 13px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:50px;
  background:#101014;
  color:#77727e;
  font-size:10px;
  font-weight:800;
}
.filter.active{
  color:#fff;
  border-color:rgba(139,92,246,.35);
  background:rgba(139,92,246,.14);
}
.list{
  margin-top:12px;
}
.asset{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
  padding:14px;
  border:1px solid rgba(255,255,255,.075);
  border-radius:18px;
  background:rgba(255,255,255,.035);
}
.asset-left{
  display:flex;
  align-items:center;
  gap:12px;
}
.asset-icon{
  width:43px;
  height:43px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:13px;
  background:linear-gradient(145deg,#292633,#111116);
  color:#c5aaff;
  font-weight:900;
}
.symbol{
  font-size:13px;
  font-weight:900;
}
.name{
  margin-top:3px;
  color:#696470;
  font-size:10px;
}
.type{
  color:#5d5864;
  font-size:8px;
  letter-spacing:1px;
}
.form{
  margin-top:20px;
}
.field{
  margin-top:15px;
}
.field:first-child{
  margin-top:0;
}
.label{
  margin-bottom:7px;
  color:#77727e;
  font-size:9px;
  font-weight:800;
  letter-spacing:1.4px;
}
.input,
.select{
  width:100%;
  padding:15px;
  border:1px solid rgba(255,255,255,.08);
  outline:none;
  border-radius:15px;
  background:#111116;
  color:#fff;
}
.input:focus,
.select:focus{
  border-color:rgba(139,92,246,.5);
}
.info{
  margin-top:16px;
  padding:13px;
  border:1px solid rgba(139,92,246,.18);
  border-radius:15px;
  background:rgba(139,92,246,.08);
  color:#b99cff;
  text-align:center;
  font-size:10px;
  font-weight:800;
}
.publish{
  width:100%;
  margin-top:13px;
  padding:16px;
  border-radius:16px;
  background:linear-gradient(135deg,#9b6cff,#6724d5);
  color:#fff;
  font-weight:900;
}
.cancel{
  width:100%;
  margin-top:8px;
  padding:15px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
  background:#111116;
  color:#77727e;
}
.empty{
  padding:25px 10px;
  color:#625d68;
  text-align:center;
  font-size:11px;
}
</style>
</head>
<body>
<div class="app">
<!-- HOME -->
<section id="home">
  <div class="header">
    <div>
      <div class="logo">VANTA</div>
      <div class="sub">EXCHANGE</div>
    </div>
    <div class="online">
      <span class="online-dot"></span>
      ONLINE
    </div>
  </div>
  <div class="id">
    VANTA ID:
    <span id="userId">подключение...</span>
  </div>
  <div class="balance">
    <div class="balance-glow"></div>
    <div class="balance-label">
      TOTAL BALANCE
    </div>
    <div
      id="balance"
      class="balance-value">
      —
    </div>
    <div class="balance-currency">
      USD
    </div>
  </div>
  <div
    id="status"
    class="status">
    Подключение...
  </div>
  <div class="grid">
    <button
      class="card"
      id="p2pButton">
      <div class="icon">⇄</div>
      <div class="card-title">
        P2P MARKET
      </div>
      <div class="card-text">
        Покупка и продажа активов
      </div>
    </button>
    <button
      class="card"
      onclick="alert('Раздел скоро будет доступен')">
      <div class="icon">↻</div>
      <div class="card-title">
        CONVERT
      </div>
      <div class="card-text">
        Конвертация активов
      </div>
    </button>
    <button
      class="card"
      onclick="alert('Раздел скоро будет доступен')">
      <div class="icon">⌁</div>
      <div class="card-title">
        MARKETS
      </div>
      <div class="card-text">
        Курсы активов
      </div>
    </button>
    <button
      class="card"
      onclick="alert('Раздел скоро будет доступен')">
      <div class="icon">◫</div>
      <div class="card-title">
        MY DEALS
      </div>
      <div class="card-text">
        История сделок
      </div>
    </button>
  </div>
</section>
<!-- P2P -->
<section
  id="p2p"
  class="screen">
  <button
    class="back"
    id="backP2P">
    ← Назад
  </button>
  <div class="title">
    P2P MARKET
  </div>
  <div class="subtitle">
    Обмен активами между пользователями
  </div>
  <div class="tabs">
    <button
      id="buyTab"
      class="active">
      Купить
    </button>
    <button
      id="sellTab">
      Продать
    </button>
  </div>
  <button
    class="create-button"
    id="createButton">
    ＋ Создать объявление
  </button>
  <div class="search">
    <span class="search-symbol">
      ⌕
    </span>
    <input
      id="searchInput"
      type="search"
      placeholder="Поиск BTC, USDT, USD..."
      autocomplete="off">
  </div>
  <div class="filters">
    <button
      class="filter active"
      data-type="all">
      Все
    </button>
    <button
      class="filter"
      data-type="crypto">
      Crypto
    </button>
    <button
      class="filter"
      data-type="stablecoin">
      Stablecoin
    </button>
    <button
      class="filter"
      data-type="fiat">
      Fiat
    </button>
  </div>
  <div
    id="assetList"
    class="list">
  </div>
</section>
<!-- CREATE -->
<section
  id="create"
  class="screen">
  <button
    class="back"
    id="backCreate">
    ← P2P MARKET
  </button>
  <div class="title">
    Создать объявление
  </div>
  <div class="subtitle">
    Ваше предложение на P2P рынке
  </div>
  <div
    id="modeInfo"
    class="info">
    Вы создаёте объявление на покупку
  </div>
  <div class="form">
    <div class="field">
      <div class="label">
        АКТИВ
      </div>
      <select
        id="assetSelect"
        class="select">
        <option value="">
          Выберите актив
        </option>
      </select>
    </div>
    <div class="field">
      <div class="label">
        ВАЛЮТА РАСЧЁТА
      </div>
      <select
        id="currencySelect"
        class="select">
        <option value="USD">
          USD — Доллар США
        </option>
        <option value="EUR">
          EUR — Евро
        </option>
        <option value="KZT">
          KZT — Тенге
        </option>
        <option value="RUB">
          RUB — Рубль
        </option>
        <option value="GBP">
          GBP — Фунт
        </option>
        <option value="CNY">
          CNY — Юань
        </option>
        <option value="AED">
          AED — Дирхам
        </option>
        <option value="TRY">
          TRY — Лира
        </option>
      </select>
    </div>
    <div class="field">
      <div class="label">
        КОЛИЧЕСТВО
      </div>
      <input
        id="amount"
        class="input"
        type="number"
        min="0"
        step="any"
        placeholder="100">
    </div>
    <div class="field">
      <div class="label">
        ЦЕНА ЗА 1 АКТИВ
      </div>
      <input
        id="price"
        class="input"
        type="number"
        min="0"
        step="any"
        placeholder="500">
    </div>
    <button
      class="publish"
      id="publishButton">
      Опубликовать
    </button>
    <button
      class="cancel"
      id="cancelButton">
      Отмена
    </button>
  </div>
</section>
</div>
<script>
/* =========================
   VANTA API
========================= */
const VANTA_API =
"https://nwbzyziszijhqtkdhhog.supabase.co/functions/v1/vanta-api";
/* =========================
   TELEGRAM
========================= */
const tg =
window.Telegram &&
window.Telegram.WebApp
  ? window.Telegram.WebApp
  : null;
if(tg){
  tg.ready();
  tg.expand();
}
/* =========================
   STATE
========================= */
let currentMode = "buy";
let currentFilter = "all";
let assets = [
  {
    symbol:"BTC",
    name:"Bitcoin",
    type:"crypto"
  },
  {
    symbol:"ETH",
    name:"Ethereum",
    type:"crypto"
  },
  {
    symbol:"USDT",
    name:"Tether",
    type:"stablecoin"
  },
  {
    symbol:"USDC",
    name:"USD Coin",
    type:"stablecoin"
  },
  {
    symbol:"USD",
    name:"US Dollar",
    type:"fiat"
  },
  {
    symbol:"EUR",
    name:"Euro",
    type:"fiat"
  },
  {
    symbol:"KZT",
    name:"Kazakhstani Tenge",
    type:"fiat"
  },
  {
    symbol:"GBP",
    name:"British Pound",
    type:"fiat"
  }
];
/* =========================
   HELPERS
========================= */
function id(name){
  return document.getElementById(name);
}
function screen(name){
  id("home").style.display = "none";
  id("p2p").style.display = "none";
  id("create").style.display = "none";
  id(name).style.display = "block";
  window.scrollTo(0,0);
}
/* =========================
   CONNECT VANTA
========================= */
async function connectVanta(){
  const user =
    tg &&
    tg.initDataUnsafe &&
    tg.initDataUnsafe.user;
  if(!user){
    id("userId").textContent =
      "Telegram";
    id("status").textContent =
      "Открой приложение через Telegram";
    return;
  }
  id("userId").textContent =
    user.username
      ? "@" + user.username
      : user.first_name || "User";
  const controller =
    new AbortController();
  const timeout =
    setTimeout(
      () => controller.abort(),
      5000
    );
  try{
    const response =
      await fetch(
        VANTA_API,
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            telegram_id:
              user.id,
            username:
              user.username || null,
            first_name:
              user.first_name || null
          }),
          signal:
            controller.signal
        }
      );
    clearTimeout(timeout);
    const text =
      await response.text();
    console.log(
      "VANTA RESPONSE:",
      text
    );
    let data;
    try{
      data =
        JSON.parse(text);
    }catch{
      throw new Error(
        "Ответ API не является JSON"
      );
    }
    if(!response.ok){
      throw new Error(
        data.error ||
        "HTTP " +
        response.status
      );
    }
    const userData =
      data.user || data;
    const balance =
      Number(
        userData.balance ?? 0
      );
    id("balance").textContent =
      balance.toLocaleString(
        "ru-RU",
        {
          maximumFractionDigits:8
        }
      );
    id("status").textContent =
      "● VANTA ACCOUNT подключён";
  }catch(error){
    clearTimeout(timeout);
    console.error(
      "VANTA ERROR:",
      error
    );
    id("balance").textContent =
      "0";
    id("status").textContent =
      "VANTA API недоступен";
  }
}
/* =========================
   RENDER ASSETS
========================= */
function renderAssets(){
  const query =
    id("searchInput")
      .value
      .trim()
      .toLowerCase();
  const filtered =
    assets.filter(asset => {
      const symbol =
        asset.symbol
          .toLowerCase();
      const name =
        asset.name
          .toLowerCase();
      const type =
        asset.type
          .toLowerCase();
      const searchOk =
        !query ||
        symbol.includes(query) ||
        name.includes(query);
      const filterOk =
        currentFilter === "all" ||
        type === currentFilter;
      return searchOk && filterOk;
    });
  if(!filtered.length){
    id("assetList").innerHTML =
      `
      <div class="empty">
        Ничего не найдено
      </div>
      `;
    return;
  }
  id("assetList").innerHTML =
    filtered.map(asset => {
      let icon = "¤";
      if(asset.type === "crypto")
        icon = "₿";
      if(asset.type === "stablecoin")
        icon = "$";
      return `
        <div
          class="asset"
          data-symbol="${asset.symbol}">
          <div class="asset-left">
            <div class="asset-icon">
              ${icon}
            </div>
            <div>
              <div class="symbol">
                ${asset.symbol}
              </div>
              <div class="name">
                ${asset.name}
              </div>
            </div>
          </div>
          <div class="type">
            ${asset.type.toUpperCase()}
          </div>
        </div>
      `;
    }).join("");
  document
    .querySelectorAll(".asset")
    .forEach(item => {
      item.onclick = () => {
        id("assetSelect").value =
          item.dataset.symbol;
        screen("create");
      };
    });
}
/* =========================
   SELECT ASSETS
========================= */
function fillSelect(){
  id("assetSelect").innerHTML =
    `<option value="">
      Выберите актив
    </option>`;
  assets.forEach(asset => {
    const option =
      document.createElement(
        "option"
      );
    option.value =
      asset.symbol;
    option.textContent =
      asset.symbol +
      " — " +
      asset.name;
    id("assetSelect")
      .appendChild(option);
  });
}
/* =========================
   EVENTS
========================= */
id("p2pButton").onclick =
  () => {
    screen("p2p");
    renderAssets();
  };
id("backP2P").onclick =
  () => screen("home");
id("createButton").onclick =
  () => screen("create");
id("backCreate").onclick =
  () => screen("p2p");
id("cancelButton").onclick =
  () => screen("p2p");
id("buyTab").onclick =
  () => {
    currentMode = "buy";
    id("buyTab")
      .classList
      .add("active");
    id("sellTab")
      .classList
      .remove("active");
    id("modeInfo").textContent =
      "Вы создаёте объявление на покупку";
  };
id("sellTab").onclick =
  () => {
    currentMode = "sell";
    id("sellTab")
      .classList
      .add("active");
    id("buyTab")
      .classList
      .remove("active");
    id("modeInfo").textContent =
      "Вы создаёте объявление на продажу";
  };
id("searchInput")
  .addEventListener(
    "input",
    renderAssets
  );
document
  .querySelectorAll(".filter")
  .forEach(button => {
    button.onclick = () => {
      document
        .querySelectorAll(".filter")
        .forEach(x =>
          x.classList.remove("active")
        );
      button.classList.add("active");
      currentFilter =
        button.dataset.type;
      renderAssets();
    };
  });
id("publishButton").onclick =
  () => {
    const asset =
      id("assetSelect").value;
    const amount =
      Number(
        id("amount").value
      );
    const price =
      Number(
        id("price").value
      );
    if(!asset){
      alert(
        "Выберите актив"
      );
      return;
    }
    if(!amount || amount <= 0){
      alert(
        "Введите количество"
      );
      return;
    }
    if(!price || price <= 0){
      alert(
        "Введите цену"
      );
      return;
    }
    alert(
      "Объявление будет опубликовано после подключения P2P-сделок"
    );
  };
/* =========================
   START
========================= */
fillSelect();
renderAssets();
connectVanta();
</script>
</body>
</html>
