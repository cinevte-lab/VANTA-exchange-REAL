<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VANTA EXCHANGE</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #0b0b0d;
      color: #ffffff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }
    .container {
      padding: 24px 18px;
    }
    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
    }
    .subtitle {
      color: #8b8b95;
      margin-top: 6px;
      font-size: 14px;
      letter-spacing: 1px;
    }
    .user {
      margin-top: 20px;
      color: #8b8b95;
      font-size: 13px;
    }
    .user span {
      color: #ffffff;
      font-weight: bold;
    }
    .balance {
      margin-top: 22px;
      padding: 20px;
      background: #151519;
      border-radius: 20px;
      border: 1px solid #222228;
    }
    .balance-title {
      color: #8b8b95;
      font-size: 13px;
      letter-spacing: 1px;
    }
    .balance-value {
      font-size: 30px;
      font-weight: bold;
      margin-top: 8px;
    }
    .balance-currency {
      color: #8b8b95;
      font-size: 13px;
      margin-top: 4px;
    }
    .menu {
      margin-top: 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .card {
      background: #151519;
      border-radius: 18px;
      padding: 18px;
      cursor: pointer;
      border: 1px solid #222228;
      transition: 0.15s;
    }
    .card:active {
      transform: scale(0.97);
    }
    .icon {
      font-size: 28px;
    }
    .card-title {
      margin-top: 12px;
      font-weight: bold;
      font-size: 15px;
    }
    .card-text {
      margin-top: 5px;
      color: #8b8b95;
      font-size: 12px;
      line-height: 1.4;
    }
    .status {
      margin-top: 20px;
      padding: 14px 16px;
      background: #111114;
      border-radius: 14px;
      color: #777780;
      font-size: 12px;
      text-align: center;
    }
    .footer {
      margin-top: 30px;
      text-align: center;
      color: #55555f;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
<div class="logo">VANTA</div>
<div class="subtitle">EXCHANGE</div>
<div class="user">
  VANTA ID: <span id="username">Загрузка...</span>
</div>
<div class="balance">
  <div class="balance-title">VANTA ACCOUNT</div>
  <div class="balance-value" id="balance">—</div>
  <div class="balance-currency">VNT</div>
</div>
<div class="menu">
  <div class="card" onclick="openSection('p2p')">
    <div class="icon">🤝</div>
    <div class="card-title">P2P MARKET</div>
    <div class="card-text">Обмен между пользователями</div>
  </div>
  <div class="card" onclick="openSection('convert')">
    <div class="icon">🔄</div>
    <div class="card-title">CONVERT</div>
    <div class="card-text">Конвертация валют</div>
  </div>
  <div class="card" onclick="openSection('markets')">
    <div class="icon">📈</div>
    <div class="card-title">MARKETS</div>
    <div class="card-text">Курсы валют и крипты</div>
  </div>
  <div class="card" onclick="openSection('deals')">
    <div class="icon">📑</div>
    <div class="card-title">MY DEALS</div>
    <div class="card-text">Активные сделки</div>
  </div>
  <div class="card" onclick="openSection('profile')">
    <div class="icon">👤</div>
    <div class="card-title">PROFILE</div>
    <div class="card-text">VANTA ID и репутация</div>
  </div>
  <div class="card" onclick="openSection('status')">
    <div class="icon">💎</div>
    <div class="card-title">STATUS</div>
    <div class="card-text">Basic · Pro · Elite</div>
  </div>
</div>
<div class="status" id="status">
  Подключение к VANTA...
</div>
<div class="footer">
  VANTA EXCHANGE © 2026
</div>
  </div>
  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    const API_URL =
      "https://nwbzyziszijhqtkdhhog.supabase.co/functions/v1/clever-task";
    async function connectVanta() {
      const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
      if (!user || !user.id) {
        document.getElementById("username").textContent = "Telegram User";
        document.getElementById("balance").textContent = "—";
        document.getElementById("status").textContent =
          "Откройте VANTA через Telegram";
        return;
      }
      const username = user.username
        ? "@" + user.username
        : (user.first_name || "User");
      document.getElementById("username").textContent = username;
      try {
        const response = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({
            telegram_id: user.id,
            username: user.username || null,
            first_name: user.first_name || null
          })
        });
        const text = await response.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch {
          throw new Error("Сервер вернул неверный ответ: " + text);
        }
        if (!response.ok || !data.success) {
          throw new Error(data.error || "API error");
        }
        const vantaUser = data.user;
        document.getElementById("balance").textContent =
          Number(vantaUser.balance || 0).toLocaleString("ru-RU");
        document.getElementById("status").textContent =
          "● VANTA ACCOUNT подключён";
      } catch (error) {
        console.error("VANTA API error:", error);
        document.getElementById("balance").textContent = "—";
        document.getElementById("status").textContent =
          "Ошибка подключения к VANTA API";
        alert("VANTA API: " + error.message);
      }
    }
    function openSection(section) {
      alert("Раздел " + section + " скоро будет доступен.");
    }
    connectVanta();
  </script>
</body>
</html>
