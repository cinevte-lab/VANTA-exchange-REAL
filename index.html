<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VANTA Exchange</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  min-height:100vh;
  color:#fff;
  background:
    radial-gradient(circle at 80% 0%,#291450 0,transparent 35%),
    radial-gradient(circle at 0% 45%,#171024 0,transparent 32%),
    #070709;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input,select{font:inherit}
button{cursor:pointer}
.app{
  max-width:620px;
  margin:auto;
  padding:22px 16px 50px;
}
.header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}
.logo{
  font-size:31px;
  font-weight:900;
  letter-spacing:4px;
}
.sub{
  margin-top:3px;
  color:#66616d;
  font-size:8px;
  letter-spacing:4px;
}
.online{
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 10px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:50px;
  color:#77727e;
  font-size:9px;
  font-weight:800;
}
.dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#9b6cff;
  box-shadow:0 0 12px #8b5cf6;
}
.user{
  margin-top:25px;
  color:#66616d;
  font-size:11px;
}
.user span{
  color:#ddd;
  font-weight:800;
}
.balance{
  position:relative;
  overflow:hidden;
  margin-top:12px;
  padding:23px;
  min-height:145px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:25px;
  background:rgba(255,255,255,.045);
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}
.glow{
  position:absolute;
  width:200px;
  height:200px;
  right:-90px;
  top:-100px;
  border-radius:50%;
  background:#7c3aed;
  opacity:.25;
  filter:blur(55px);
}
.label{
  position:relative;
  color:#77727e;
  font-size:9px;
  font-weight:800;
  letter-spacing:2px;
}
.balance-value{
  position:relative;
  margin-top:9px;
  font-size:38px;
  font-weight:900;
}
.currency{
  position:relative;
  margin-top:5px;
  color:#68636f;
  font-size:10px;
}
.status{
  margin-top:12px;
  padding:12px;
  border:1px solid rgba(255,255,255,.07);
  border-radius:14px;
  background:rgba(255,255,255,.025);
  color:#77727e;
  text-align:center;
  font-size:10px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}
.card{
  min-height:140px;
  padding:17px;
  text-align:left;
  border:1px solid rgba(255,255,255,.075);
  border-radius:21px;
  background:rgba(255,255,255,.04);
  color:#fff;
}
.card:active{
  transform:scale(.97);
}
.icon{
  width:43px;
  height:43px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:14px;
  background:rgba(139,92,246,.12);
  color:#c6adff;
  font-size:20px;
}
.card-title{
  margin-top:13px;
  font-size:13px;
  font-weight:900;
}
.card-text{
  margin-top:5px;
  color:#68636f;
  font-size:10px;
  line-height:1.45;
}
.screen{
  display:none;
}
.back{
  background:none;
  color:#88838f;
  font-size:12px;
}
.title{
  margin-top:20px;
  font-size:30px;
  font-weight:900;
}
.subtitle{
  margin-top:5px;
  color:#6d6875;
  font-size:11px;
}
.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  margin-top:20px;
  padding:5px;
  border:1px solid rgba(255,255,255,.07);
  border-radius:16px;
  background:#101014;
}
.tabs button{
  padding:12px;
  border-radius:12px;
  background:transparent;
  color:#77727e;
  font-weight:800;
}
.tabs button.active{
  color:#fff;
  background:linear-gradient(135deg,#9b6cff,#6724d5);
}
.create{
  width:100%;
  margin-top:10px;
  padding:15px;
  border-radius:15px;
  background:#fff;
  color:#08080a;
  font-weight:900;
}
.search{
  position:relative;
  margin-top:18px;
}
.search-icon{
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
  color:#77727e;
  font-size:19px;
}
.search input{
  width:100%;
  height:54px;
  padding:0 16px 0 45px;
  outline:none;
  border:1px solid rgba(255,255,255,.1);
  border-radius:17px;
  background:#111116;
  color:#fff;
  font-size:14px;
}
.search input::placeholder{
  color:#57535e;
}
.search input:focus{
  border-color:rgba(139,92,246,.55);
  box-shadow:0 0 0 3px rgba(139,92,246,.08);
}
.filters{
  display:flex;
  gap:7px;
  margin-top:10px;
  overflow-x:auto;
  scrollbar-width:none;
}
.filters::-webkit-scrollbar{
  display:none;
}
.filter{
  flex:none;
  padding:9px 13px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:50px;
  background:#101014;
  color:#77727e;
  font-size:10px;
  font-weight:800;
}
.filter.active{
  color:#fff;
  border-color:rgba(139,92,246,.35);
  background:rgba(139,92,246,.14);
}
.list{
  margin-top:12px;
}
.asset{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
  padding:14px;
  border:1px solid rgba(255,255,255,.075);
  border-radius:18px;
  background:rgba(255,255,255,.035);
}
.asset-left{
  display:flex;
  align-items:center;
  gap:12px;
}
.asset-icon{
  width:43px;
  height:43px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:13px;
  background:linear-gradient(145deg,#292633,#111116);
  color:#c5aaff;
  font-weight:900;
}
.symbol{
  font-size:13px;
  font-weight:900;
}
.name{
  margin-top:3px;
  color:#696470;
  font-size:10px;
}
.type{
  color:#5d5864;
  font-size:8px;
  letter-spacing:1px;
}
.form{
  margin-top:20px;
}
.field{
  margin-top:15px;
}
.field:first-child{
  margin-top:0;
}
.field-label{
  margin-bottom:7px;
  color:#77727e;
  font-size:9px;
  font-weight:800;
  letter-spacing:1.4px;
}
.input,.select{
  width:100%;
  padding:15px;
  outline:none;
  border:1px solid rgba(255,255,255,.08);
  border-radius:15px;
  background:#111116;
  color:#fff;
}
.info{
  margin-top:16px;
  padding:13px;
  border:1px solid rgba(139,92,246,.18);
  border-radius:15px;
  background:rgba(139,92,246,.08);
  color:#b99cff;
  text-align:center;
  font-size:10px;
  font-weight:800;
}
.publish{
  width:100%;
  margin-top:13px;
  padding:16px;
  border-radius:16px;
  background:linear-gradient(135deg,#9b6cff,#6724d5);
  color:#fff;
  font-weight:900;
}
.cancel{
  width:100%;
  margin-top:8px;
  padding:15px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
  background:#111116;
  color:#77727e;
}
.empty{
  padding:25px 10px;
  color:#625d68;
  text-align:center;
  font-size:11px;
}
</style>
</head>
<body>
<div class="app">
<section id="home">
  <div class="header">
    <div>
      <div class="logo">VANTA</div>
      <div class="sub">EXCHANGE</div>
    </div>
    <div class="online">
      <span class="dot"></span>
      ONLINE
    </div>
  </div>
  <div class="user">
    VANTA ID:
    <span id="userId">подключение...</span>
  </div>
  <div class="balance">
    <div class="glow"></div>
    <div class="label">
      TOTAL BALANCE
    </div>
    <div
      id="balance"
      class="balance-value">
      0.00
    </div>
    <div class="currency">
      USD
    </div>
  </div>
  <div
    id="status"
    class="status">
    Подключение к VANTA...
  </div>
  <div class="grid">
    <button
      class="card"
      id="p2pButton">
      <div class="icon">⇄</div>
      <div class="card-title">
        P2P MARKET
      </div>
      <div class="card-text">
        Покупка и продажа активов
      </div>
    </button>
    <button
      class="card"
      onclick="alert('Раздел скоро будет доступен')">
      <div class="icon">↻</div>
      <div class="card-title">
        CONVERT
      </div>
      <div class="card-text">
        Конвертация активов
      </div>
    </button>
    <button
      class="card"
      onclick="alert('Раздел скоро будет доступен')">
      <div class="icon">⌁</div>
      <div class="card-title">
        MARKETS
      </div>
      <div class="card-text">
        Курсы активов
      </div>
    </button>
    <button
      class="card"
      onclick="alert('Раздел скоро будет доступен')">
      <div class="icon">◫</div>
      <div class="card-title">
        MY DEALS
      </div>
      <div class="card-text">
        История сделок
      </div>
    </button>
  </div>
</section>
<section id="p2p" class="screen">
  <button
    class="back"
    id="backP2P">
    ← Назад
  </button>
  <div class="title">
    P2P MARKET
  </div>
  <div class="subtitle">
    Обмен активами между пользователями
  </div>
  <div class="tabs">
    <button
      id="buyTab"
      class="active">
      Купить
    </button>
    <button
      id="sellTab">
      Продать
    </button>
  </div>
  <button
    class="create"
    id="createButton">
    ＋ Создать объявление
  </button>
  <div class="search">
    <span class="search-icon">
      ⌕
    </span>
    <input
      id="searchInput"
      type="search"
      placeholder="Поиск BTC, USDT, USD..."
      autocomplete="off">
  </div>
  <div class="filters">
    <button
      class="filter active"
      data-type="all">
      Все
    </button>
    <button
      class="filter"
      data-type="crypto">
      Crypto
    </button>
    <button
      class="filter"
      data-type="stablecoin">
      Stablecoin
    </button>
    <button
      class="filter"
      data-type="fiat">
      Fiat
    </button>
  </div>
  <div
    id="assetList"
    class="list">
  </div>
</section>
<section id="create" class="screen">
  <button
    class="back"
    id="backCreate">
    ← P2P MARKET
  </button>
  <div class="title">
    Создать объявление
  </div>
  <div class="subtitle">
    Ваше предложение на P2P рынке
  </div>
  <div
    id="modeInfo"
    class="info">
    Вы создаёте объявление на покупку
  </div>
  <div class="form">
    <div class="field">
      <div class="field-label">
        АКТИВ
      </div>
      <select
        id="assetSelect"
        class="select">
        <option value="">
          Выберите актив
        </option>
      </select>
    </div>
    <div class="field">
      <div class="field-label">
        ВАЛЮТА РАСЧЁТА
      </div>
      <select
        id="currencySelect"
        class="select">
        <option value="USD">USD — Доллар США</option>
        <option value="EUR">EUR — Евро</option>
        <option value="KZT">KZT — Тенге</option>
        <option value="RUB">RUB — Рубль</option>
        <option value="GBP">GBP — Фунт</option>
        <option value="CNY">CNY — Юань</option>
        <option value="AED">AED — Дирхам</option>
        <option value="TRY">TRY — Лира</option>
      </select>
    </div>
    <div class="field">
      <div class="field-label">
        КОЛИЧЕСТВО
      </div>
      <input
        id="amount"
        class="input"
        type="number"
        min="0"
        step="any"
        placeholder="100">
    </div>
    <div class="field">
      <div class="field-label">
        ЦЕНА ЗА 1 АКТИВ
      </div>
      <input
        id="price"
        class="input"
        type="number"
        min="0"
        step="any"
        placeholder="500">
    </div>
    <button
      class="publish"
      id="publishButton">
      Опубликовать
    </button>
    <button
      class="cancel"
      id="cancelButton">
      Отмена
    </button>
  </div>
</section>
</div>
<script>
/* ============================
   ВАЖНО:
   ТВОЯ ФУНКЦИЯ НАЗЫВАЕТСЯ
   dynamic-action
============================ */
const VANTA_API =
"https://nwbzyziszijhqtkdhhog.supabase.co/functions/v1/dynamic-action";
const tg =
window.Telegram &&
window.Telegram.WebApp
  ? window.Telegram.WebApp
  : null;
if(tg){
  tg.ready();
  tg.expand();
}
let currentMode = "buy";
let currentFilter = "all";
const assets = [
  {
    symbol:"BTC",
    name:"Bitcoin",
    type:"crypto"
  },
  {
    symbol:"ETH",
    name:"Ethereum",
    type:"crypto"
  },
  {
    symbol:"USDT",
    name:"Tether",
    type:"stablecoin"
  },
  {
    symbol:"USDC",
    name:"USD Coin",
    type:"stablecoin"
  },
  {
    symbol:"USD",
    name:"US Dollar",
    type:"fiat"
  },
  {
    symbol:"EUR",
    name:"Euro",
    type:"fiat"
  },
  {
    symbol:"KZT",
    name:"Kazakhstani Tenge",
    type:"fiat"
  },
  {
    symbol:"GBP",
    name:"British Pound",
    type:"fiat"
  }
];
function $(id){
  return document.getElementById(id);
}
function showScreen(name){
  $("home").style.display = "none";
  $("p2p").style.display = "none";
  $("create").style.display = "none";
  $(name).style.display = "block";
  window.scrollTo(0,0);
}
/* ============================
   VANTA CONNECTION
============================ */
async function connectVanta(){
  if(!tg){
    $("userId").textContent =
      "Telegram";
    $("status").textContent =
      "Открой приложение через Telegram";
    return;
  }
  const user =
    tg.initDataUnsafe &&
    tg.initDataUnsafe.user;
  if(!user){
    $("userId").textContent =
      "не найден";
    $("status").textContent =
      "Telegram ID не получен";
    return;
  }
  $("userId").textContent =
    user.username
      ? "@" + user.username
      : user.first_name || String(user.id);
  const controller =
    new AbortController();
  const timeout =
    setTimeout(
      () => controller.abort(),
      7000
    );
  try{
    const response =
      await fetch(
        VANTA_API,
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            telegram_id:
              user.id,
            username:
              user.username || null,
            first_name:
              user.first_name || null
          }),
          signal:
            controller.signal
        }
      );
    clearTimeout(timeout);
    const text =
      await response.text();
    console.log(
      "VANTA API:",
      response.status,
      text
    );
    let data;
    try{
      data =
        JSON.parse(text);
    }catch{
      throw new Error(
        "API вернул не JSON"
      );
    }
    if(!response.ok){
      throw new Error(
        data.error ||
        "HTTP " +
        response.status
      );
    }
    if(data.ok === false){
      throw new Error(
        data.error ||
        "API error"
      );
    }
    const userData =
      data.user || data;
    const balance =
      Number(
        userData.balance ?? 0
      );
    $("balance").textContent =
      balance.toLocaleString(
        "ru-RU",
        {
          minimumFractionDigits:2,
          maximumFractionDigits:8
        }
      );
    $("status").textContent =
      "● VANTA ACCOUNT подключён";
  }catch(error){
    clearTimeout(timeout);
    console.error(
      "VANTA CONNECTION ERROR:",
      error
    );
    $("balance").textContent =
      "0.00";
    $("status").textContent =
      "Ошибка подключения к VANTA API";
  }
}
/* ============================
   ASSETS
============================ */
function renderAssets(){
  const query =
    $("searchInput")
      .value
      .trim()
      .toLowerCase();
  const filtered =
    assets.filter(asset => {
      const matchesSearch =
        !query ||
        asset.symbol
          .toLowerCase()
          .includes(query) ||
        asset.name
          .toLowerCase()
          .includes(query);
      const matchesFilter =
        currentFilter === "all" ||
        asset.type === currentFilter;
      return (
        matchesSearch &&
        matchesFilter
      );
    });
  if(!filtered.length){
    $("assetList").innerHTML =
      `
      <div class="empty">
        По вашему запросу ничего не найдено
      </div>
      `;
    return;
  }
  $("assetList").innerHTML =
    filtered.map(asset => {
      let icon = "¤";
      if(asset.type === "crypto")
        icon = "₿";
      if(asset.type === "stablecoin")
        icon = "$";
      return `
        <div
          class="asset"
          data-symbol="${asset.symbol}">
          <div class="asset-left">
            <div class="asset-icon">
              ${icon}
            </div>
            <div>
              <div class="symbol">
                ${asset.symbol}
              </div>
              <div class="name">
                ${asset.name}
              </div>
            </div>
          </div>
          <div class="type">
            ${asset.type.toUpperCase()}
          </div>
        </div>
      `;
    }).join("");
  document
    .querySelectorAll(".asset")
    .forEach(item => {
      item.onclick = () => {
        $("assetSelect").value =
          item.dataset.symbol;
        showScreen("create");
      };
    });
}
function fillAssets(){
  assets.forEach(asset => {
    const option =
      document.createElement("option");
    option.value =
      asset.symbol;
    option.textContent =
      asset.symbol +
      " — " +
      asset.name;
    $("assetSelect")
      .appendChild(option);
  });
}
/* ============================
   BUTTONS
============================ */
$("p2pButton").onclick =
  () => {
    showScreen("p2p");
    renderAssets();
  };
$("backP2P").onclick =
  () => showScreen("home");
$("createButton").onclick =
  () => showScreen("create");
$("backCreate").onclick =
  () => showScreen("p2p");
$("cancelButton").onclick =
  () => showScreen("p2p");
$("buyTab").onclick =
  () => {
    currentMode = "buy";
    $("buyTab")
      .classList
      .add("active");
    $("sellTab")
      .classList
      .remove("active");
    $("modeInfo").textContent =
      "Вы создаёте объявление на покупку";
  };
$("sellTab").onclick =
  () => {
    currentMode = "sell";
    $("sellTab")
      .classList
      .add("active");
    $("buyTab")
      .classList
      .remove("active");
    $("modeInfo").textContent =
      "Вы создаёте объявление на продажу";
  };
$("searchInput")
  .addEventListener(
    "input",
    renderAssets
  );
document
  .querySelectorAll(".filter")
  .forEach(button => {
    button.onclick = () => {
      document
        .querySelectorAll(".filter")
        .forEach(x =>
          x.classList.remove("active")
        );
      button.classList.add("active");
      currentFilter =
        button.dataset.type;
      renderAssets();
    };
  });
$("publishButton").onclick =
  () => {
    const asset =
      $("assetSelect").value;
    const amount =
      Number(
        $("amount").value
      );
    const price =
      Number(
        $("price").value
      );
    if(!asset){
      alert("Выберите актив");
      return;
    }
    if(amount <= 0){
      alert("Введите количество");
      return;
    }
    if(price <= 0){
      alert("Введите цену");
      return;
    }
    alert(
      "Функция публикации объявления будет подключена следующим этапом."
    );
  };
/* ============================
   START
============================ */
fillAssets();
renderAssets();
connectVanta();
</script>
</body>
</html>
